<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика · 5 клас · Домашнє завдання</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=STIX+Two+Text:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#16152e;--mu:#6c6a8a;--ln:#e4e2f3;--ok:#14a86b;--mid:#e8a213;--bad:#ee4b6a;--c:hsl(250 78% 60%);--cs:color-mix(in srgb,var(--c) 11%,transparent);--m:"STIX Two Text","Cambria Math",Georgia,serif;color-scheme:light only;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tiles div{background:var(--cs);border-radius:18px;padding:12px 6px}
.tiles b{display:block;font:800 26px/1.1 Onest}
.tiles span{font-size:13px;color:var(--mu);font-weight:700}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:500 16px/1.5 Onest,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(40% 35% at 10% 0%,color-mix(in srgb,var(--c) 28%,transparent),transparent),radial-gradient(35% 30% at 100% 20%,color-mix(in srgb,var(--c) 14%,#ff7ab8 12%),transparent);transition:background .6s}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font:800 clamp(34px,10vw,54px)/1 Onest;letter-spacing:-.04em;margin:8px 0 10px}
h1 em{font-style:normal;color:var(--c)}
h2{font:800 22px/1.2 Onest;letter-spacing:-.02em;margin:0}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:20px;box-shadow:0 24px 48px -32px color-mix(in srgb,var(--c) 55%,transparent);animation:in .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stack{display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:14px}
.chip{background:var(--cs);color:var(--c);border-radius:99px;padding:5px 13px;font-weight:800;font-size:14px;white-space:nowrap}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg i{flex:1;height:7px;border-radius:9px;background:var(--ln)}
.seg .ok{background:var(--ok)}.seg .no{background:var(--bad)}.seg .now{background:var(--c)}
.q{font:600 clamp(22px,6vw,28px)/1.55 var(--m);padding:8px 2px 18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt,.btn{font:700 20px/1.3 var(--m);color:var(--tx);background:var(--card);border:1.5px solid var(--ln);border-radius:20px;padding:14px 16px;min-height:60px;cursor:pointer;text-align:center;transition:transform .15s cubic-bezier(.3,1.6,.5,1),border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:active:not(:disabled),.btn:active{transform:scale(.97)}
.opt.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}
.opt.no{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.no){opacity:.5}
.btn{font:800 17px Onest;color:#fff;background:var(--c);border:0;width:100%;box-shadow:0 14px 26px -14px var(--c)}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--ln);box-shadow:none}
input{font:700 22px var(--m);width:100%;padding:14px 16px;border-radius:20px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);margin-bottom:10px;outline:none;min-height:60px}
input:focus{border-color:var(--c);box-shadow:0 0 0 4px var(--cs)}
.fb{margin-top:14px;border-radius:20px;padding:14px 16px;background:var(--cs);animation:in .3s}
.fb b{display:block;font-size:17px;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.fb p{margin:2px 0 14px;color:var(--mu)}
.f{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.82em;line-height:1.15}
.f i{font-style:normal;padding:0 .2em}.f i:first-child{border-bottom:.07em solid currentColor}
.w{margin-right:.05em}
.blk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--ln);border-radius:20px;background:var(--card)}
.blk .e{font-size:24px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cs)}
.blk small{display:block;color:var(--mu);font-weight:500}
.blk div:nth-child(2){flex:1;font-weight:700;line-height:1.25}
.grade{font:800 clamp(80px,26vw,130px)/1 Onest;letter-spacing:-.06em;text-align:center;margin:6px 0 0}
.grade small{font-size:.28em;color:var(--mu);letter-spacing:0;font-weight:700}
.gl{text-align:center;font-weight:700;margin-bottom:14px}
.hi{color:var(--ok)}.md{color:var(--mid)}.lo{color:var(--bad)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.sc{font:800 22px Onest;min-width:64px;text-align:right}
.sc small{font-size:13px;color:var(--mu);font-weight:700}
.wr{border-top:1px solid var(--ln);padding:14px 0 2px}
.wr:first-of-type{border-top:0}
.wr .t{font:600 20px/1.5 var(--m);margin:6px 0}
.wr .r{font-size:15px}
.wr .r span{font-weight:800}
.home{border:1px solid var(--ln);background:var(--card);width:44px;height:44px;border-radius:16px;font-size:20px;cursor:pointer;flex:none;transition:transform .15s}.home:active{transform:scale(.9)}
.blk.go{cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .2s}.blk.go:hover{transform:translateY(-3px);border-color:var(--c)}.blk.go:active{transform:scale(.98)}
.opt.ok{animation:pop .45s}.opt.no{animation:shake .4s}
@keyframes pop{40%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.bar i{transition:width .9s cubic-bezier(.2,.9,.3,1)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}.cf span{position:absolute;top:-30px;font-size:24px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.pr{height:10px;border-radius:9px;background:var(--ln);overflow:hidden;margin:14px 0 6px}.pr i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .8s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:9}
.tm{display:flex;gap:12px;align-items:center;padding:11px 0;animation:in .55s cubic-bezier(.3,1.3,.5,1) both;animation-delay:var(--d)}
.tm .te{font-size:22px;width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--cs)}
.tm .tb{flex:1;min-width:0}.tm .tn{display:flex;justify-content:space-between;gap:10px;font-weight:700;line-height:1.25}
.tm .tp{font:800 18px Onest;font-variant-numeric:tabular-nums}.tm.hi .tp{color:var(--ok)}.tm.md .tp{color:var(--mid)}.tm.lo .tp{color:var(--bad)}
.tm small{color:var(--mu);font-weight:600;font-size:13px}
.tr{height:12px;border-radius:9px;background:var(--ln);overflow:hidden;margin:7px 0 5px}
.tr i{display:block;height:100%;width:0;border-radius:9px;position:relative;overflow:hidden;transition:width 1.3s cubic-bezier(.2,.9,.25,1)}
.tm.hi .tr i{background:linear-gradient(90deg,#14a86b,#6ee7b0);box-shadow:0 0 12px #14a86b66}
.tm.md .tr i{background:linear-gradient(90deg,#e8a213,#ffd36b);box-shadow:0 0 12px #e8a21355}
.tm.lo .tr i{background:linear-gradient(90deg,#ee4b6a,#ff9bb0);box-shadow:0 0 12px #ee4b6a55}
.tr i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffffaa 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s 1.6s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.pb{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}.pb:first-of-type{border-top:0}.pb .te{font-size:22px;width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--cs)}.pb p{margin:4px 0 0;font-size:15px;color:var(--mu)}.pb small{color:var(--mu)}

/* ===== краса й анімації ===== */
body::before{animation:aur 16s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(32% 28% at 85% 88%,#5ad8ff33,transparent),radial-gradient(30% 26% at 6% 78%,#ff8fd244,transparent),radial-gradient(26% 22% at 55% 40%,#ffe27a2e,transparent);animation:aur2 22s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) scale(1.12);filter:hue-rotate(35deg)}}
@keyframes aur2{to{transform:translate(-5%,-4%) scale(1.1);filter:hue-rotate(-30deg)}}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg span{position:absolute;bottom:-70px;opacity:0;animation:fl linear infinite;filter:drop-shadow(0 6px 10px #5b4bd422)}
@keyframes fl{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.4}88%{opacity:.4}100%{transform:translate(var(--dx),-118vh) rotate(var(--r));opacity:0}}
.card{background:#ffffffe8;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero{position:relative;height:130px;margin:0 0 4px;display:grid;place-items:center}
.hero .big{font-size:78px;line-height:1;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 14px 14px #5b4bd44d)}
.hero .o{position:absolute;font-size:28px;animation:tw 2.8s ease-in-out infinite}
.hero .o:nth-child(2){left:14%;top:12%}.hero .o:nth-child(3){right:14%;top:6%;animation-delay:.7s}.hero .o:nth-child(4){left:24%;bottom:6%;animation-delay:1.4s}.hero .o:nth-child(5){right:22%;bottom:10%;animation-delay:2.1s}
@keyframes bob{50%{transform:translateY(-12px) rotate(-6deg)}}
@keyframes tw{0%,100%{transform:scale(.75) rotate(-10deg);opacity:.55}50%{transform:scale(1.2) rotate(12deg);opacity:1}}
#go{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 14px 26px -14px var(--c),0 0 0 0 color-mix(in srgb,var(--c) 40%,transparent)}50%{box-shadow:0 14px 26px -14px var(--c),0 0 0 11px transparent}}
h1 em{background:linear-gradient(90deg,var(--c),#ff6fb5,#ffb454,var(--c));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite}
@keyframes grad{to{background-position:250% 0}}
.rk{position:relative;height:30px;margin:0 6px 2px}
.rk span{position:absolute;bottom:0;font-size:24px;transform:translateX(-50%) rotate(45deg);transition:left .9s cubic-bezier(.3,1.3,.5,1);animation:hov 1.4s ease-in-out infinite}
.rk span::after{content:"🔥";position:absolute;left:-12px;top:12px;font-size:13px;transform:rotate(-135deg);opacity:.85}
@keyframes hov{50%{margin-bottom:4px}}
.qe{font-size:34px;line-height:1;animation:bob 2.6s ease-in-out infinite;display:inline-block;margin:2px 0 4px}
.stg .opt{animation:in .45s backwards}.stg .opt:nth-child(2){animation-delay:.06s}.stg .opt:nth-child(3){animation-delay:.12s}.stg .opt:nth-child(4){animation-delay:.18s}
.rx{display:inline-block;font-size:24px;vertical-align:-3px;animation:bnc .8s cubic-bezier(.3,1.8,.5,1)}
@keyframes bnc{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.tro{font-size:70px;line-height:1;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 12px 16px #ffb43366)}
.fb{animation:in .35s cubic-bezier(.3,1.4,.5,1)}
.btn:hover{filter:brightness(1.06)}
.chip{box-shadow:0 6px 16px -10px var(--c)}
.seg i{transition:background .4s,transform .3s}.seg .now{animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{transform:scaleY(1.7)}}

/* ===== адаптивність для телефонів ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
.tn span:first-child{min-width:0;overflow-wrap:anywhere}
.opt{overflow-wrap:anywhere}
@media(max-width:520px){
 #app{padding:10px 12px 36px}
 .card{padding:16px;border-radius:22px}
 h1{font-size:clamp(30px,9.5vw,44px)}
 h2{font-size:19px}
 .hero{height:104px}.hero .big{font-size:60px}.hero .o{font-size:22px}
 .q{font-size:clamp(19px,5.6vw,24px);padding:4px 0 14px}
 .qe{font-size:28px}
 .opt{font-size:18px;min-height:54px;padding:11px 12px;border-radius:17px}
 .btn{font-size:16px;min-height:54px;border-radius:17px}
 input{font-size:20px;min-height:54px;border-radius:17px}
 .top{margin-bottom:8px}
 .chip{font-size:13px;padding:5px 11px}
 .home{width:40px;height:40px;border-radius:14px}
 .seg{gap:2px;margin-bottom:10px}.seg i{height:6px}
 .rk{height:26px}.rk span{font-size:20px}
 .fb{padding:12px 13px}.fb b{font-size:16px}
 .tiles{gap:6px}.tiles b{font-size:22px}.tiles span{font-size:12px}
 .tm,.pb{gap:10px}.tm .te,.pb .te{width:40px;height:40px;font-size:19px;border-radius:13px}
 .tm .tn{font-size:15px}.tm .tp{font-size:16px}
 .wr .t{font-size:18px}
 .tro{font-size:56px}
 #bg span:nth-child(3n){display:none}
}
@media(max-width:360px){
 .opt{font-size:16.5px}.tiles b{font-size:19px}.tiles span{font-size:11px}
 .tm .tn{flex-direction:column;gap:0}
}
@media(max-height:480px) and (orientation:landscape){.hero{display:none}#app{padding-top:6px}}
</style>

["1 кг печива коштує 62,5 грн. Скільки гривень решти отримає покупець зі 200 грн, купивши 2,4 кг?","50",["150","60","40"],"62,5 · 2,4 = 150; 200 − 150 = 50 (грн).",11],
["Чи можна спростити суму 5a + 7a? Якщо так — обери результат.","Так: 12a",["Так: 57a","Так: 12a²","Ні, не можна"],"Букви однакові (a), тому коефіцієнти додаємо: 5 + 7 = 12, буква лишається: 12a.",12],
["Чи можна спростити суму 3x + 4y? Якщо так — обери результат.","Ні, не можна",["Так: 7xy","Так: 7x","Так: 7y"],"Букви різні (x та y), тому додати їх не можна — це не подібні доданки.",12],
["Яку з цих сум можна спростити?","7c + 2c",["3a + 5b","4x + 6y","8m + 2n"],"Спростити можна лише доданки з однаковою буквою: 7c + 2c = 9c.",12],
["Спростіть вираз: 4a + 3b + 2a + 5b","6a + 8b",["10ab","14ab","6a + 8"],"Додаємо окремо: 4a + 2a = 6a та 3b + 5b = 8b. Букви a та b між собою не додаються.",12]
];
const T=[["Додавання й віднімання","➕","Повтори віднімання у стовпчик із позичанням та зручне групування доданків."],["Множення й ділення","✖️","Потренуй множення й ділення у стовпчик, а також розподільну властивість."],["× і : на 10, 100, 1000","🔟","Пригадай: скільки нулів — на стільки цифр переносимо кому (× вправо, : вліво)."],["× і : на 0,1; 0,01; 0,001","🔬","Пам’ятай: × на 0,1 — те саме, що : на 10; : на 0,1 — те саме, що × на 10."],["Степінь числа","🔺","Степінь — це множення однакових чисел: 2⁴ = 2·2·2·2, а не 2·4."],["Приклади на всі дії","🧮","Повтори порядок дій: дужки → степінь → × і : → + і −."],["Рівняння","⚖️","Пригадай правила: невідоме зменшуване, від’ємник, доданок, множник, дільник."],["Складніші рівняння","🧩","Спочатку спрощуй обидві частини, потім шукай невідоме по кроках."],["Звичайні дроби","🍕","Дроби з однаковим знаменником: знаменник не змінюється, діємо з чисельниками."],["Мішані числа","🥧","Повтори переведення мішаних чисел у неправильні дроби й навпаки."],["Десяткові дроби: + і −","🪄","Записуй кому під комою; недостатні розряди доповнюй нулями."],["Десяткові дроби: × і :","🎯","Множ без коми, а потім відлічи розряди; при діленні переноси кому в обох числах."],["Подібні доданки (букви й числа)","🔤","Додавати можна лише доданки з однаковою буквою: 5a + 7a = 12a, а 3x + 4y — ні."]];
const TOT=Q.length,$=s=>document.querySelector(s),app=$("#app");
let S;try{S=JSON.parse(localStorage.getItem("hw11"))}catch(e){}
S=S||{name:"",q:0,a:{},v:"start"};
const save=()=>{try{localStorage.setItem("hw11",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fx=s=>esc(s).replace(/(\d*)\{(\d+)\|(\d+)\}/g,(m,w,a,b)=>(w?`<span class=w>${w}</span>`:"")+`<span class=f><i>${a}</i><i>${b}</i></span>`);
const plain=s=>String(s).replace(/(\d*)\{(\d+)\|(\d+)\}/g,(m,w,a,b)=>(w?w+" ":"")+a+"/"+b);
const nm=s=>String(s).replace(/[\s\u00a0]/g,"").replace(".",",").toLowerCase();
const sh=(a,s)=>{a=[...a];for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)&0x7fffffff;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const got=q=>S.a[q],okq=q=>got(q)!==undefined&&nm(got(q))==nm(Q[q][1]);
const cnt=()=>Q.filter((_,i)=>okq(i)).length,answered=()=>Object.keys(S.a).length;
Q.forEach((q,i)=>{if(q[4]===undefined)q[4]=i/3|0});
Q.splice(0,Q.length,...sh(Q,2026));
const grade=c=>Math.max(1,Math.round(c/TOT*12));
const gc=g=>g>=10?"hi":g>=7?"md":"lo";
const label=g=>g>=11?"Блискуче! 🏆":g>=9?"Дуже добре! 🎉":g>=7?"Непогано, є що підтягнути":g>=4?"Потрібно ще попрактикуватись":"Давай повторимо разом";
const setC=h=>document.documentElement.style.setProperty("--c",`hsl(${h} 78% 60%)`);
const go=v=>{S.v=v;save();render();scrollTo(0,0)};
const EM=["🎉","✨","⭐","🎊","💜","🌈","🎈","🌟"];
const cu=(e,to)=>{const t=e.firstChild;let s=null;const f=n=>{s=s||n;const p=Math.min((n-s)/700,1);t.nodeValue=Math.round(to*p);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
const burst=(n=26)=>{const d=document.createElement("div");d.className="cf";d.innerHTML=Array.from({length:n},()=>`<span style="left:${Math.random()*100}%;animation-delay:${Math.random()*.6}s">${EM[Math.random()*EM.length|0]}</span>`).join("");document.body.append(d);setTimeout(()=>d.remove(),3200)};
const OKM=[["🎉","Супер! Правильно!"],["🌟","Клас! Так!"],["🔥","Так тримати!"],["👏","Молодець!"],["💪","Блискуче!"]],NOM=[["🤔","Майже! Подивись розбір"],["💡","Не здавайся — ось як правильно"],["😉","Нічого, розберемось"]];
const streak=()=>{let n=0,i=S.q-(got(S.q)===undefined?1:0);while(i>=0&&okq(i)){n++;i--}return n};
const firstOpen=()=>{const i=Q.findIndex((_,i)=>got(i)===undefined);return i<0?0:i};
function render(){({start,quiz,fin})[S.v]()}

function start(){
 setC(250);const n=answered();
 app.innerHTML=`<div class=stack><div class=hero><span class=big>🚀</span><span class=o>✨</span><span class=o>⭐</span><span class=o>🌈</span><span class=o>💫</span></div><div style="padding:4px 4px 4px"><span class=chip>Домашнє завдання</span><h1>Математика<br><em>5 клас</em></h1><p class=mu style="margin:0;max-width:30em">${TOT} завдань вперемішку. У кінці — оцінка за 12-бальною шкалою, відсотки по темах і список тем, які треба повторити. Прогрес зберігається: можна вийти на головну й повернутись.</p></div>
 <div class=card><label class=mu style="font-weight:700;font-size:14px">Твоє ім’я</label><input id=nm placeholder="Наприклад, Софія" value="${esc(S.name)}" style="margin-top:8px;font-family:Onest"><div class=pr><i style="width:${n/TOT*100}%"></i></div><p class=mu style="margin:0 0 12px;font-size:14px">Виконано ${n} із ${TOT} завдань</p><button class=btn id=go>${n>=TOT?"Дивитись результати 🏆":n?"Продовжити 🚀":"Поїхали! 🚀"}</button>${n?`<button class="btn ghost" id=rs style="margin-top:10px">Почати спочатку</button>`:""}</div></div>`;
 $("#go").onclick=()=>{S.name=$("#nm").value.trim();if(answered()>=TOT)go("fin");else{S.q=firstOpen();go("quiz")}};
 const r=$("#rs");if(r)r.onclick=()=>{if(confirm("Стерти всі відповіді й почати спочатку?")){S={name:S.name,q:0,a:{},v:"quiz"};save();render()}};
}

function quiz(){
 const q=S.q,t=Q[q],g=got(q),done=g!==undefined,typed=!t[2].length;
 setC(250);
 const seg=Q.map((_,i)=>`<i class="${got(i)===undefined?(i==q?"now":""):okq(i)?"ok":"no"}"></i>`).join("");
 const opts=sh([t[1],...t[2]],(q*7+3)*977);
 let body;
 if(typed)body=done?`<input disabled value="${esc(g)}" style="border-color:var(--${okq(q)?"ok":"bad"})">`:`<input id=in inputmode="decimal" autocomplete="off" placeholder="Твоя відповідь"><button class=btn id=chk>Перевірити</button>`;
 else body=`<div class="opts${done?"":" stg"}">${opts.map((o,i)=>`<button class="opt ${done?(o==t[1]?"ok":o==g?"no":""):""}" data-i="${i}" ${done?"disabled":""}>${fx(o)}</button>`).join("")}</div>`;
 const ok=done&&okq(q);
 const fb=done?`<div class="fb ${ok?"ok":"no"}"><b><span class=rx>${(ok?OKM[q%5]:NOM[q%3])[0]}</span> ${(ok?OKM[q%5]:NOM[q%3])[1]}</b><p>${ok?"":`Правильна відповідь: <strong>${fx(t[1])}</strong>. `}${fx(t[3])}</p><button class=btn id=nx>${q<TOT-1?"Далі":"Завершити"}</button></div>`:"";
 app.innerHTML=`<div class=top><button class=home id=hm aria-label="На головну">🏠</button><span class=chip>Завдання ${q+1} з ${TOT}</span><span class=mu>${streak()>1?"🔥 "+streak():""}</span></div><div class=rk><span style="left:${Math.min(96,Math.max(4,(q+(done?1:0))/TOT*100))}%">🚀</span></div><div class=seg>${seg}</div><div class=card${done?' style="animation:none"':""}><div class=qe>${["🧠","💡","🎯","🔥","⭐","🌟","🧩","🎲"][q%8]}</div><div class=q>${fx(t[0])}</div>${body}${fb}</div>`;
 const ans=v=>{S.a[q]=v;save();quiz();if(okq(q))burst(streak()%5==0?30:10);setTimeout(()=>$("#nx")&&$("#nx").scrollIntoView({block:"nearest",behavior:"smooth"}),60)};
 app.querySelectorAll(".opt").forEach(e=>e.onclick=()=>ans(opts[e.dataset.i]));
 $("#hm").onclick=()=>go("start");const chk=()=>{const v=$("#in").value.trim();if(v)ans(v)};
 if($("#chk")){$("#chk").onclick=chk;$("#in").onkeydown=e=>{if(e.key=="Enter")chk()};$("#in").focus()}
 if($("#nx"))$("#nx").onclick=()=>{if(q<TOT-1){S.q++;save();quiz();scrollTo(0,0)}else go("fin")};
}

const M=()=>T.map((t,ti)=>{const qs=Q.map((_,i)=>i).filter(i=>Q[i][4]==ti),c=qs.filter(okq).length;return{t,c,n:qs.length,p:Math.round(c/qs.length*100)}}).sort((a,b)=>b.p-a.p);
const lv=p=>p>=75?"hi":p>=50?"md":"lo";
const st=p=>p>=100?"Засвоєно ідеально ✨":p>=75?"Добре засвоєно":p>=50?"Потрібно ще повторити":"Варто вивчити наново";
const cp=(e,to,d)=>{setTimeout(()=>{let s=null;const f=n=>{s=s||n;const k=Math.min((n-s)/1100,1);e.textContent=Math.round(to*(1-Math.pow(1-k,3)))+"%";if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)},d)};
function summary(){
 const L=[`Домашнє завдання · Математика 5 клас${S.name?" · "+S.name:""}`,`Оцінка: ${grade(cnt())}/12 (правильно ${cnt()} із ${TOT})`,""];
 L.push(`Проблемні теми: ${M().filter(m=>m.p<75).reverse().map(m=>m.t[0]+" ("+m.p+"%)").join("; ")||"немає"}`);L.push("");L.push("Засвоєння тем:");M().forEach(m=>L.push(`${m.t[1]} ${m.t[0]}: ${m.p}%`));L.push("");
 Q.forEach((t,i)=>{if(!okq(i))L.push(`✗ ${plain(t[0])} — відповідь учня: ${plain(got(i)??"—")}, правильно: ${plain(t[1])}`)});
 return L.join("\n");
}

function fin(){
 setC(250);const c=cnt(),g=grade(c);
 const wrong=Q.map((t,i)=>({t,i,g:got(i)})).filter(w=>!okq(w.i));
 app.innerHTML=`<div class=stack><div class=card style="text-align:center"><div class=tro>${g>=11?"🏆":g>=9?"🥇":g>=7?"🌟":g>=4?"💪":"📚"}</div><div class=mu style="font-weight:700">${S.name?esc(S.name)+", твоя оцінка":"Твоя оцінка"}</div><div class="grade ${gc(g)}">${g}<small>/12</small></div><div class=gl>${label(g)}</div><div class=tiles><div><b class=hi>${c}</b><span>правильно</span></div><div><b class=lo>${TOT-c}</b><span>помилок</span></div><div><b>${Math.round(c/TOT*100)}%</b><span>успішність</span></div></div><p class=mu style="margin:14px 0 0;font-size:14px">Засвоєно тем (75% і вище): <b>${M().filter(m=>m.p>=75).length} з ${T.length}</b></p><div class=seg style="margin:12px 0 0">${Q.map((_,i)=>`<i class="${okq(i)?"ok":"no"}"></i>`).join("")}</div></div>
 <div class=card><h2 style="margin-bottom:4px">📊 Наскільки засвоєно теми</h2><p class=mu style="margin:0 0 6px;font-size:14px">Від найкраще засвоєних до тих, що потребують повторення</p>${M().map((m,k)=>`<div class="tm ${lv(m.p)}" style="--d:${k*110}ms"><div class=te>${m.t[1]}</div><div class=tb><div class=tn><span>${m.t[0]}</span><span class=tp data-p="${m.p}">0%</span></div><div class=tr><i data-w="${m.p}%"></i></div><small>${st(m.p)} · ${m.c} з ${m.n}</small></div></div>`).join("")}</div>
 <div class=card><h2 style="margin-bottom:8px">🎯 Теми, з якими є проблеми</h2>${M().filter(m=>m.p<75).reverse().map(m=>`<div class=pb><div class=te>${m.t[1]}</div><div><b>${m.t[0]}</b> — <span class=${lv(m.p)}>${m.p}%</span> <small>(${m.c} з ${m.n})</small><p>${m.t[2]}</p></div></div>`).join("")||`<p class=mu style="margin:0">Проблемних тем немає — усі засвоєно на 75% і вище 🎉</p>`}</div>
 <div class=card><h2 style="margin-bottom:8px">${wrong.length?"🔍 Над чим попрацювати":"Помилок немає 🎉"}</h2>${wrong.length?wrong.map(w=>`<div class=wr><span class=chip>Завдання ${w.i+1}</span><div class=t>${fx(w.t[0])}</div><div class=r>Твоя відповідь: <span class=lo>${fx(w.g??"—")}</span><br>Правильно: <span class=hi>${fx(w.t[1])}</span></div><p class=mu style="margin:6px 0 4px;font-size:15px">${fx(w.t[3])}</p></div>`).join(""):`<p class=mu style="margin:0">Усі завдання виконано правильно. Чудова робота!</p>`}</div>
 <button class=btn id=sd>Надіслати результат вчителю</button><button class="btn ghost" id=hm>🏠 На головну</button><button class="btn ghost" id=rs>Пройти ще раз</button></div>`;
 cu($(".grade"),g);if(g>=7)burst();document.querySelectorAll(".tm").forEach((r,k)=>{const d=k*110+300;setTimeout(()=>r.querySelector(".tr i").style.width=r.querySelector(".tr i").dataset.w,d);cp(r.querySelector(".tp"),+r.querySelector(".tp").dataset.p,d)});$("#hm").onclick=()=>go("start");
 $("#sd").onclick=async()=>{const t=summary();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name=="AbortError")return}
  try{await navigator.clipboard.writeText(t);toast("Результат скопійовано")}catch(e){prompt("Скопіюй результат:",t)}};
 $("#rs").onclick=()=>{if(confirm("Стерти відповіді й пройти заново?")){S={name:S.name,q:0,a:{},v:"quiz"};save();render();scrollTo(0,0)}};
}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
(()=>{const E=["➕","➖","✖️","➗","🔢","📐","📏","🧮","💡","⭐","✨","🌈","☁️","🚀","🎈","🪐","🧠","🎯"],b=$("#bg");E.concat(E.slice(0,6)).forEach(e=>{const s=document.createElement("span");s.textContent=e;s.style.cssText=`left:${Math.random()*96}%;font-size:${20+Math.random()*26|0}px;animation-duration:${18+Math.random()*20}s;animation-delay:-${Math.random()*34}s;--dx:${(Math.random()-.5)*160|0}px;--r:${(Math.random()-.5)*540|0}deg`;b.append(s)})})();
if(!["start","quiz","fin"].includes(S.v))S.v="start";
render();
</script>
</body>
</html>
